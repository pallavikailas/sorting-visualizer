apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sorting-visualizer.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sorting-visualizer.labels" . | nindent 4 }}
data:
  # Runtime configuration surfaced to the app via meta tags (future use)
  APP_VERSION: {{ .Chart.AppVersion | quote }}
  RELEASE_NAME: {{ .Release.Name | quote }}
