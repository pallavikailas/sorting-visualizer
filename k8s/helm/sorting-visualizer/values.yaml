# ── Default values for sorting-visualizer ────────────────────────────────────
# Override any of these in a values override file or --set flags.

# -- Number of pod replicas
replicaCount: 2

image:
  # -- Image repository (no tag here; use appVersion from Chart.yaml)
  repository: sorting-visualizer
  # -- Image pull policy. Use "Never" for kind/local, "IfNotPresent" for remote
  pullPolicy: Never
  # -- Overrides the image tag. Defaults to chart appVersion when empty.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # -- Whether to create a dedicated ServiceAccount
  create: true
  # -- Annotations to add (e.g. for AWS IRSA or GKE Workload Identity)
  annotations: {}
  # -- ServiceAccount name; auto-generated when blank
  name: ""

podAnnotations:
  prometheus.io/scrape: "false"   # flip to "true" if you add a metrics endpoint

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101       # nginx default user in nginx:alpine
  fsGroup: 101

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # nginx writes temp files; keep false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE  # needed for port 80 inside the container

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: sorting-visualizer.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 20m
    memory: 32Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# -- Extra environment variables injected into the nginx container
extraEnv: []

# -- Node selector constraints
nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sorting-visualizer
          topologyKey: kubernetes.io/hostname
