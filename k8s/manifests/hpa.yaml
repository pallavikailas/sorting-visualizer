apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sorting-visualizer
  namespace: sorting-visualizer
  labels:
    app.kubernetes.io/name: sorting-visualizer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sorting-visualizer
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
